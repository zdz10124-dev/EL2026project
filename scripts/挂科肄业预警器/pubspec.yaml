name: course_warning_app
description: 挂科肄业预警器 - 帮助学生明确毕业目标、挂科风险及学习进度的手机应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI 组件库
  cupertino_icons: ^1.0.6
  
  # 状态管理
  provider: ^6.1.1
  
  # 网络请求
  http: ^1.2.0
  dio: ^5.4.0
  
  # 本地存储
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # 加密
  crypto: ^3.0.3
  encrypt: ^5.0.3
  
  # 通知与闹钟
  flutter_local_notifications: ^17.0.0
  
  # 图表显示
  fl_chart: ^0.66.0
  
  # 其他工具
  intl: ^0.19.0
  url_launcher: ^6.2.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
